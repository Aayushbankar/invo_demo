# =============================================================================
# InvoDemo - Docker Compose
# Full stack: Next.js app + Self-hosted Supabase
# =============================================================================

# Load environment variables
x-env: &env
  environment:
    # Supabase URLs (internal Docker network)
    NEXT_PUBLIC_SUPABASE_URL: http://kong:8000
    NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
    SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    SUPABASE_URL: http://kong:8000
    SUPABASE_ANON_KEY: ${ANON_KEY}
    SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}

services:
  # =============================================================================
  # Next.js Application
  # =============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    <<: *env
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: InvoDemo
    depends_on:
      db:
        condition: service_healthy
      supabase-auth:
        condition: service_started
    restart: unless-stopped
    networks:
      - supabase-net

  # =============================================================================
  # Supabase Services
  # =============================================================================

  # API Gateway
  kong:
    image: kong/kong:3.9.1
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
      - "8444:8444"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_RESOLVER: 127.0.0.11
      KONG_NGINX_PROXY_PROXY_SET_HEADER: "X-Forwarded-For \$proxy_add_x_forwarded_for"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_LATENCY_HEADERS: "on"
      KONG_LOG_LEVEL: info
    volumes:
      - ./supabase/docker/volumes/api/kong.yml:/var/lib/kong/kong.yml:ro
    depends_on:
      supabase-auth:
        condition: service_started
      supabase-rest:
        condition: service_started
      supabase-storage:
        condition: service_started
    networks:
      - supabase-net

  # Auth (GoTrue)
  supabase-auth:
    image: supabase/gotrue:v2.189.0
    ports:
      - "9999:9999"
    environment:
      API_EXTERNAL_URL: http://localhost:8000
      SITE_URL: http://localhost:3000
      ADDITIONAL_REDIRECT_URLS: "[]"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
      DB_DRIVER: postgres
      DB_DBNAME: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: supabase_auth_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SSL_MODE: disable
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMS_AUTOCONFIRM: "true"
      GOMAXPROCS: 2
      GOTRUE_ADMIN_EMAIL: admin@example.com
      GOTRUE_ADMIN_PASSWORD: ${DASHBOARD_PASSWORD:-password}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - supabase-net

  # REST API (PostgREST)
  supabase-rest:
    image: postgrest/postgrest:v14.12.0
    ports:
      - "3001:3000"
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: 3600
    depends_on:
      db:
        condition: service_healthy
    networks:
      - supabase-net

  # Storage
  supabase-storage:
    image: supabase/storage-api:v1.60.4
    ports:
      - "5000:5000"
    volumes:
      - ./supabase/docker/volumes/storage:/var/lib/storage
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGRES_ANALYTICS_ENABLED: "false"
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      STORAGE_BACKEND: file
      TENANT_ID: stub
      IS_MULTITENANT: "false"
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:5001
      PGRST_DB_URI: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: storage
      PGRST_DB_ANON_ROLE: service_role
      PGRST_DB_USE_LEGACY_GUCS: "false"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - supabase-net

  # Image Proxy
  supabase-imgproxy:
    image: darthsim/imgproxy:v3.30.1
    ports:
      - "5001:5001"
    environment:
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
      IMGPROXY_ENABLE_AVIF_DETECTION: "true"
    networks:
      - supabase-net

  # PostgreSQL
  db:
    image: supabase/postgres:17.6.1.136
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_PORT: 5432
    volumes:
      - ./supabase/docker/volumes/db/data:/var/lib/postgresql/data
      - ./supabase/docker/volumes/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - supabase-net

  # Studio (Dashboard)
  supabase-studio:
    image: supabase/studio:latest
    ports:
      - "3002:3000"
    environment:
      STUDIO_PG_META_URL: http://supabase-meta:8080
      SUPABASE_URL: http://kong:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_API_URL: http://supabase-auth:9999
    depends_on:
      supabase-meta:
        condition: service_started
    networks:
      - supabase-net

  # Postgres Meta
  supabase-meta:
    image: supabase/postgres-meta:v0.96.6
    ports:
      - "8080:8080"
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: "5432"
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - supabase-net

networks:
  supabase-net:
    driver: bridge
